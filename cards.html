<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conceito de cards</title>
    <link rel="stylesheet" href="aula03.css"/>
</head>
<body>
    <h1>Conceito de cards</h1>
    <div class="container">
        <div class="card-gato">
            <h3>Primeiro Item</h3>
            <img src="gato.webp" alt="Gato deitado" title="Gato deitado"/>
            <p>Um gato fofo deitado.</p>
            <button type="button">Saiba mais</button>
        </div>
        <div class="card-laranja">
            <h3>Segundo Item</h3>
            <img src="laranjairritante.webp" alt="A Laranja Irritante" title="Uma Laranja sorridente, e irritante"/>
            <p>A Laranja Irritante, uma série de 2 temporadas sobre uma laranja irritante.</p>
            <button type="button">Saiba mais</button>
        </div>
        <div class="card-moranguinho">
            <h3>Terceiro Item</h3>
            <img src="moranguinho.webp" alt="Moranguinho versão 2003, e seu cachorrinho ao lado" title="Moranguinho versão 2003"/>
            <p>A moranguinho da versão de 2003, com seu cachorrinho pudim ao lado.</p>
            <button type="button">Saiba mais</button>
        </div>
        <div class="card-bananas">
            <h3>Quarto Item</h3>
            <img src="bananasdepijama.jpg" alt="Bananas de Pijamas" title="Bananas de Pijamas, B1 e B2"/>
            <p>Bananas de Pijamas, B1 e B2</p>
            <button type="button">Saiba mais</button>
        </div>
    </div>
</body>
</html>

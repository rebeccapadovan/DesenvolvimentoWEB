<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Todos os inputs</h1>
    <h3>Inputs da parte 1</h3>
    <p style="font-size: 12px;">Página 14</p>
    <form action="#" method="get" style="margin: 15px;">
        <input type="button" name="Botão" id="id_button"/>
        <label for="id_button">Botão</label><br/>
        <label>Checkboxes</label>
        <input type="checkbox" value="opção1" name="Checkbox1" id="id_checkbox1"/>
        <label for="id_checkbox1">opção 1</label>
        <input type="checkbox" value="opção2" name="Checkbox2" id="id_checkbox2"/>
        <label for="id_checkbox2">opção 2</label>
        <input type="checkbox" value="opção3" name="Checkbox3" id="id_checkbox3">
        <label for="id_checkbox3">opção 3</label><br/>
        <input type="color" name="Cor" id="id_color"/>
        <label for="id_color">Escolha a cor</label><br/>
        <input type="date" name="Data" id="id_date"/>
        <label for="id_date">Selecione a data</label><br/>
        <input type="datetime-local" name="Data e Hora" id="id_datetime"/>
        <label for="id_datetime">Calendário com hora</label><br/>
    <h3>Inputs da parte 2</h3>
    <p style="font-size: 12px;">Página 15</p>
        <label for="id_email">Email</label>
        <input type="email" name="Email" id="id_email"/><br/>
        <label for="id_file">Upload de arquivos</label>
        <input type="file" name="Arquivos" id="id_file"/><br/>
        <label for="id_hidden">Input que não é visível ao usuário</label>
        <input type="hidden" name="Input não visível" id="id_hidden"/><br/>
        <label for="id_img">Imagem</label>
        <input type="image" name="Imagem" id="id_img"/><br/>
        <label for="id_month">Meses do ano</label>
        <input type="month" name="Meses" id="id_month"/><br/>
        <label for="id_number">Só pode números</label>
        <input type="number" name="Números" id="id_number"/><br/>
        <label></label>
    <h3>Inputs da parte 3</h3>
    <p style="font-size: 12px;">Página 16</p>
        <label for="id_password">Senha</label>
        <input type="password" name="Senha" id="id_password"/><br/>
        <label>Seleção única</label>
        <input type="radio" value="1opção" name="Seleção única" id="id_radio1"/>
        <label for="id_radio1">1 opção</label>  
        <input type="radio" value="2opção" name="Seleção única" id="id_radio2"/>
        <label for="id_radio2">2 opção</label>
        <input type="radio" value="3opção" name="Seleção única" id="id_radio3"/>
        <label for="id_radio3">3 opção</label><br/>
        <label for="id_range">Campo numérico deslizante</label>
        <input type="range" name="Campo deslizante" id="id_range"/><br/>
        <label for="id_search">Pesquisa</label>
        <input type="search" name="Pesquisa" id="id_search"/><br/>
        <label for="id_submit">Envio de Formulário</label>
        <input type="submit" name="Envio de Formulário" id="id_submit"/><br/>
    <h3>Inputs da parte 4</h3>
    <p style="font-size: 12px;">Página 17</p>
        <label for="id_tel">Telefone</label>
        <input type="tel" name="Telefone" id="id_tel"/><br/>
        <label for="id_text">Texto</label>
        <input type="text" name="Texto" id="id_text"/><br/>
        <label for="id_time">Tempo</label>
        <input type="time" name="Tempo" id="id_time"/><br/>
        <label for="id_url">Endereço de Sites</label>
        <input type="url" name="Endereço de Sites" id="id_url"/><br/>
        <label>Segunda a sexta</label>
        <input type="week" name="Segunda a Sexta" id="id_week"/>
    </form>
</body>
</html>

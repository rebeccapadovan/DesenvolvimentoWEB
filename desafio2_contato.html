<!DOCTYPE html>

<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio 2, contato</title>
</head>
<body style="background-color: rgb(255, 248, 239);">
    <h1 style="color: #333;">Entre em contato conosco</h1>
    <form action="#" method="get" style="margin: 15px;" onsubmit="alert('Enviado com sucesso!')">
        <fieldset>
            <legend>Informações de contato</legend>
            <label for="nome">Nome:</label><br/>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo" required/><br/><br/>
            <label for="telefone">Telefone</label><br/>
            <input type="tel" name="telefone" id="telefone" placeholder="(00)00000-0000" required/><br/><br/>
            <label for="email">Email</label><br/>
            <input type="email" name="email" id="email" placeholder="seuemail@gmail.com" required/><br/><br/>
            <label for="assunto">Assunto:</label><br/>
            <select name="assunto" id="assunto">
                <option value="sugestao">Sugestão</option>
                <option value="outro">Outro</option>
            </select><br/><br/>
            <label for="mensagem">Mensagem</label><br/>
            <textarea id="mensagem" name="mensagem" placeholder="Sua mensagem aqui"></textarea><br/><br/>
            <button type="submit">Enviar</button>
        </fieldset>
    </form>
</body>
</html>
